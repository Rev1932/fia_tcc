# Coleta a telemetria da API de credit scoring.
#
# O alvo é resolvido pelo alias `api` na rede da stack de serving — por isso
# esta stack declara `mlops_default` como externa: não se monitora o que não
# existe, e `make obs-up` depende de `make mlops-up`.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hc-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          servico: credit-scoring

  # O Prometheus se observa: sem isto, uma falha do próprio coletor fica cega.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
