# Observabilidade da API de credit scoring: Prometheus coleta, Grafana desenha.
#
# Stack SEPARADA da de serving, pelo mesmo motivo que o Airflow é separado: são
# ciclos de vida diferentes. O monitoramento pode cair e subir sem tocar em quem
# está servindo predição — e é justamente isso que se quer de um observador.
#
# Uso:
#   make obs-up            (sobe; depende da stack de serving estar de pé)
#   http://localhost:3000  Grafana, sem login
#   http://localhost:9090  Prometheus
#
# A rede vem de fora: o alvo `api:8000` só resolve dentro de `mlops_default`.

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: hc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Volume nomeado, não bind: o Prometheus roda como nobody (65534) e um
      # bind do host daria "lock DB directory: permission denied" no TSDB.
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.4
    container_name: hc-grafana
    ports:
      - "3000:3000"
    environment:
      # Sem login: é painel de demonstração local, e a fricção de digitar senha
      # no meio da apresentação não paga o que protege. Viewer, nunca Admin —
      # anônimo com Admin apaga dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: "light"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # O provider aponta para a pasta; os JSON dos painéis vão à parte. É aqui
      # que se costuma tropeçar: um arquivo não substitui o outro.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Nomeado pelo mesmo motivo do Prometheus: o Grafana roda como UID 472.
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: mlops_default
    external: true
