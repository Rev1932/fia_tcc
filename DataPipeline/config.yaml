# Configuração do pipeline de dados — Home Credit Default Risk
# Caminhos, parâmetros de limpeza e metadados da ABT.

paths:
  raw_dir: data/risco_fraude/home-credit-default-risk
  application_train: application_train.csv
  bureau: bureau.csv
  bureau_balance: bureau_balance.csv
  previous_application: previous_application.csv
  pos_cash: POS_CASH_balance.csv
  credit_card: credit_card_balance.csv
  installments: installments_payments.csv
  # Saídas
  clean_data: Dados/clean_data.csv
  abt: Dados/abt.csv
  abt_parquet: Dados/abt.parquet
  profile_out: artifacts/abt_profile.json
  raw_sample: Dados/raw_data.csv

target: TARGET
id_col: SK_ID_CURR

# Amostragem opcional para execução rápida (null = base completa)
sample_n: null
random_state: 42

sanitization:
  # Valor sentinela de DAYS_EMPLOYED (~1000 anos) -> NaN
  days_employed_sentinel: 365243
  # Coluna anômala: XNA em CODE_GENDER -> NaN
  drop_gender_xna: true
  # Clip de outliers de renda no percentil superior
  income_clip_quantile: 0.999

abt:
  # Estatísticas usadas nas agregações por cliente
  agg_funcs: [mean, sum, max, min, count]
  # Grava também em Parquet (a API lê daí)
  write_parquet: true

  # Fix 1 — CATEGÓRICAS das tabelas relacionais.
  # A versão anterior da ABT só agregava colunas numéricas e descartava estas
  # em silêncio. bureau_balance.STATUS é o histórico mês a mês de atraso e
  # previous_application.NAME_CONTRACT_STATUS é o histórico de recusa: os dois
  # sinais mais fortes da base ficavam de fora das 473 colunas.
  # Deixe a lista vazia ({}) para reproduzir a ABT v1.
  categorical_agg:
    max_categories: 15          # cauda longa vira "OUTROS"
    bureau: [CREDIT_ACTIVE, CREDIT_TYPE]
    bureau_balance: [STATUS]
    previous_application: [NAME_CONTRACT_STATUS, CODE_REJECT_REASON,
                           NAME_YIELD_GROUP, NAME_CLIENT_TYPE, NAME_PORTFOLIO]
    pos_cash: [NAME_CONTRACT_STATUS]
    credit_card: [NAME_CONTRACT_STATUS]

  # Fix 5 — janela recente em paralelo às agregações vitalícias.
  # Comportamento recente prediz melhor que média de vida inteira, e para quem
  # tem histórico curto (jovens) a média vitalícia é ruidosa.
  recent_window:
    pos_cash:      {column: MONTHS_BALANCE, months: 12}
    credit_card:   {column: MONTHS_BALANCE, months: 12}
    installments:  {column: DAYS_INSTALMENT, months: 12}
    previous_application: {column: DAYS_DECISION, months: 24}
  # Ratios derivados (numerador / denominador)
  ratios:
    CREDIT_INCOME_RATIO: [AMT_CREDIT, AMT_INCOME_TOTAL]
    ANNUITY_INCOME_RATIO: [AMT_ANNUITY, AMT_INCOME_TOTAL]
    CREDIT_TERM: [AMT_ANNUITY, AMT_CREDIT]
    EMPLOYED_AGE_RATIO: [DAYS_EMPLOYED, DAYS_BIRTH]
