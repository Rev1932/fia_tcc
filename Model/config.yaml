# Configuração de modelagem — credit scoring Home Credit
# Hiperparâmetros, split e régua de decisão por custo de negócio.

paths:
  abt: Dados/abt.csv
  abt_parquet: Dados/abt.parquet      # usado quando existir (leitura muito mais rápida)
  model_out: artifacts/model.joblib
  metrics_out: artifacts/metrics.json
  feature_meta_out: artifacts/feature_metadata.json
  scores_out: artifacts/scores.parquet

# Artefatos canônicos: tudo que documento, notebook e API leem sai daqui.
# Nenhum número de slide pode vir de outro lugar.
artifacts:
  roc_max_points: 300      # downsample da ROC (roc_curve devolve ~30k pontos)
  sweep_points: 99         # mesmo grid de business_threshold — não desalinhar
  bootstrap_n: 500         # reamostragens do IC de AUC por segmento

target: TARGET
id_col: SK_ID_CURR

split:
  test_size: 0.2
  valid_size: 0.2
  # Fatia exclusiva de calibração (Fix 7), recortada do treino.
  # 0 desliga a calibração e reproduz o split original 60/20/20.
  calib_size: 0.1
  random_state: 42
  stratify: true

# Baseline interpretável
baseline:
  model: logistic_regression
  params:
    max_iter: 1000
    C: 1.0
    class_weight: balanced

# Modelo campeão
champion:
  model: lightgbm
  params:
    objective: binary
    metric: auc
    n_estimators: 2000
    learning_rate: 0.02
    num_leaves: 34
    max_depth: 8
    min_child_samples: 70
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    is_unbalance: true
    random_state: 42
    n_jobs: -1
  early_stopping_rounds: 100

  # EXPERIMENTO — reponderação dos segmentos de baixa confiança medida.
  # Hipótese: o AUC cai nos extremos de idade porque são poucos (<25 são ~4%
  # da base) e o gradiente é dominado pelo miolo da distribuição.
  # Regra de aceite (TODO.md §4): só fica se melhorar o segmento-alvo SEM
  # piorar o global. Resultado do experimento registrado em TODO.md §2.
  sample_weight:
    enabled: false
    segments:
      age_band:
        "<25": 3.0
        "55-65": 2.0

# Matriz de custo para o threshold de negócio (em unidades monetárias relativas)
business:
  cost_false_negative: 1.0   # aprovar quem dá default -> perde o crédito
  cost_false_positive: 0.10  # negar bom pagador -> perde margem/receita
